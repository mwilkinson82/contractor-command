<!doctype html><html><body style="margin:0;background:#333;display:flex;gap:16px;padding:8px;align-items:flex-start"><iframe srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;lookahead.html&lt;/title&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap&quot;&gt;&lt;style&gt;body{margin:0}/*
 * Shared web-page shell for Athena&#x27;s /r/ job pages (RFI, RFC and change order logs, and the live report pages).
 * Same look as the accounting suite: soft blue-gray page, white panels, navy ink, one link blue.
 * Desktop uses the full width up to 1440px; tablet keeps tables at real width with a side scroll;
 * phones stack every table row into a labelled card.
 */
.ath-page {
  --ath-ink: #18314f;
  --ath-ink-strong: #183b63;
  --ath-muted: #65788e;
  --ath-soft: #53677d;
  --ath-line: #dfe7f0;
  --ath-line-soft: #e8edf4;
  --ath-head: #edf3fa;
  --ath-link: #2465cb;
  --ath-focus: #659ff4;
  --ath-alert: #dc2626;
  min-height: 100vh;
  min-width: 0;
  padding: 24px clamp(16px, 3vw, 40px) 56px;
  background: #f5f8fc;
  color: var(--ath-ink);
  font:
    14px/1.55 &quot;Archivo&quot;,
    Arial,
    sans-serif;
  overflow-wrap: anywhere;
}
.ath-page *,
.ath-page *::before,
.ath-page *::after {
  box-sizing: border-box;
}
.ath-page a {
  color: var(--ath-link);
  text-underline-offset: 3px;
}
.ath-page :is(a, button, input, select, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--ath-focus);
  outline-offset: 3px;
}
.ath-page-wrap {
  max-width: 1440px;
  margin: 0 auto;
  min-width: 0;
}

/* Top bar: Athena mark on the left, project links on the right. */
.ath-page-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 20px;
  margin-bottom: 22px;
}
.ath-page-mark {
  color: #6080a4;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.ath-page-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  font-size: 13px;
}
.ath-page-nav a {
  font-weight: 600;
  text-decoration: none;
}
.ath-page-nav a:hover {
  text-decoration: underline;
}
.ath-page-account {
  color: var(--ath-muted);
  font-size: 12px;
}

/* Title row: title and job on the left, filters on the right on wide screens. */
.ath-page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 24px;
  margin-bottom: 22px;
}
.ath-page-head h1 {
  margin: 0;
  font-size: clamp(24px, 3vw, 32px);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--ath-ink);
}
.ath-page-sub {
  margin: 6px 0 0;
  color: var(--ath-soft);
  font-size: 14px;
}
.ath-page-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
}
.ath-page-filters label {
  display: grid;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ath-soft);
}
.ath-page-filters label.ath-page-check {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  font-size: 13px;
}
.ath-page select {
  min-height: 42px;
  min-width: 11rem;
  max-width: 100%;
  padding: 9px 12px;
  background: #fff;
  border: 1px solid #cbd6e3;
  border-radius: 7px;
  font: inherit;
  font-size: 14px;
  color: var(--ath-ink);
  box-shadow: 0 1px 2px #18345304;
}
.ath-page input[type=&quot;checkbox&quot;] {
  width: 18px;
  height: 18px;
  accent-color: var(--ath-link);
}
.ath-page button {
  min-height: 42px;
  padding: 9px 16px;
  border: 1px solid #bbcee7;
  border-radius: 7px;
  background: #fff;
  color: var(--ath-link);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.ath-page-content &gt; * + * {
  margin-top: 22px;
}

/* Number tiles: one row on desktop, two across on phones. */
.ath-page-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin: 0;
}
.ath-page-kpi {
  padding: 16px 18px;
  background: #fff;
  border: 1px solid var(--ath-line);
  border-radius: 12px;
  box-shadow: 0 3px 12px #18345304;
}
.ath-page-kpi dt {
  font-size: 12px;
  color: var(--ath-muted);
}
.ath-page-kpi dd {
  margin: 2px 0 0;
  font-size: 24px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--ath-ink-strong);
}
.ath-page-kpi[data-alert] {
  border-color: #f3c8d0;
}
.ath-page-kpi[data-alert] dd {
  color: var(--ath-alert);
}

/* White panel per section. */
.ath-page-panel {
  min-width: 0;
  padding: 22px;
  background: #fff;
  border: 1px solid var(--ath-line);
  border-radius: 14px;
  box-shadow: 0 3px 12px #18345304;
}
.ath-page-panel &gt; h2 {
  margin: 0 0 14px;
  font-size: 18px;
  line-height: 1.35;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--ath-ink);
}
.ath-page-panel &gt; ul {
  margin: 0;
  padding-left: 20px;
}
.ath-page-panel &gt; ul &gt; li + li {
  margin-top: 6px;
}
.ath-page-panel .ath-page-literal {
  white-space: pre-wrap;
}
.ath-page-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ath-page-links a {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid #bbcee7;
  border-radius: 7px;
  background: #fff;
  font-weight: 600;
  text-decoration: none;
}
.ath-page-alert {
  padding: 14px 16px;
  background: #fff3f5;
  border: 1px solid #f3c8d0;
  border-radius: 10px;
  color: #9f243a;
}
.ath-page-alert strong {
  display: block;
  margin-bottom: 2px;
}
.ath-page-empty {
  padding: 14px 16px;
  border: 1px dashed #d7e2ef;
  border-radius: 9px;
  background: #f8fafd;
  color: var(--ath-muted);
}
.ath-page-next {
  margin: 0;
  color: var(--ath-soft);
}
.ath-page-next strong {
  color: var(--ath-ink);
}
.ath-page-foot {
  margin: 28px 0 0;
  font-size: 12px;
  color: var(--ath-muted);
}
.ath-page-status {
  padding: 32px 0;
  color: var(--ath-soft);
}

/* Tables: full width on desktop, real width with a side scroll on tablet, stacked cards on phone. */
.ath-page-table-wrap {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--ath-line);
  border-radius: 10px;
  background: #fff;
}
.ath-page-table {
  width: 100%;
  border-collapse: collapse;
  /* Words break only when they must, so narrow columns never shrink to one letter a line. */
  overflow-wrap: break-word;
  font-size: 13px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.ath-page-table th,
.ath-page-table td {
  padding: 12px 14px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--ath-line-soft);
}
.ath-page-table thead {
  background: var(--ath-head);
  color: var(--ath-soft);
}
.ath-page-table thead th {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.015em;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ath-page-table tbody tr:last-child td {
  border-bottom: 0;
}
.ath-page-table tbody tr:nth-child(even) {
  background: #fafcfe;
}
.ath-page-table tbody tr:hover {
  background: #f0f6ff;
}
.ath-page-table td:first-child {
  white-space: nowrap;
}
.ath-page-table td:first-child a {
  font-weight: 650;
  text-decoration: none;
}
.ath-page-table td:first-child a:hover {
  text-decoration: underline;
}
.ath-page-table :is(td, th).is-short,
.ath-page-table :is(td, th).is-num {
  white-space: nowrap;
  overflow-wrap: normal;
}
.ath-page-table td.is-num {
  text-align: right;
}
.ath-page-table td.is-long {
  min-width: 16rem;
}
.ath-page-table td.is-blank::after {
  content: &quot;–&quot;;
  color: #a3b2c3;
}
.ath-page-table tr[data-alert] td:first-child {
  box-shadow: inset 4px 0 0 var(--ath-alert);
}
.ath-page-table tr[data-alert] td:first-child a,
.ath-page-flag {
  color: var(--ath-alert);
}
.ath-page-flag {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ath-page-ref {
  display: block;
  font-size: 12px;
  color: var(--ath-muted);
}

/* Tablet: tables keep a readable width and pan sideways inside their frame. */
@media (max-width: 1024px) {
  .ath-page-table {
    min-width: 860px;
  }
  .ath-page-head {
    align-items: flex-start;
  }
}

/* Phone: each row becomes a card with the column name beside each value. */
@media (max-width: 720px) {
  .ath-page {
    padding: 18px 14px 40px;
  }
  .ath-page-top {
    margin-bottom: 16px;
  }
  .ath-page-head {
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 16px;
  }
  .ath-page-filters {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .ath-page select {
    width: 100%;
  }
  .ath-page-kpis {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
  }
  .ath-page-kpi {
    padding: 12px 14px;
  }
  .ath-page-kpi dd {
    font-size: 20px;
  }
  .ath-page-panel {
    padding: 16px;
  }
  .ath-page-table-wrap {
    overflow: visible;
    border: 0;
    background: transparent;
  }
  .ath-page-table {
    min-width: 0;
  }
  .ath-page-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .ath-page-table,
  .ath-page-table tbody,
  .ath-page-table tr,
  .ath-page-table td {
    display: block;
    width: 100%;
  }
  .ath-page-table tbody tr {
    margin-bottom: 12px;
    padding: 4px 0;
    border: 1px solid var(--ath-line);
    border-radius: 10px;
    background: #fff;
  }
  .ath-page-table tbody tr:nth-child(even),
  .ath-page-table tbody tr:hover {
    background: #fff;
  }
  .ath-page-table tr[data-alert] {
    border-left: 4px solid var(--ath-alert);
  }
  .ath-page-table tr[data-alert] td:first-child {
    box-shadow: none;
  }
  .ath-page-table td {
    display: grid;
    grid-template-columns: minmax(6.5rem, 34%) minmax(0, 1fr);
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--ath-line-soft);
    text-align: left;
    white-space: normal;
  }
  .ath-page-table td.is-num {
    text-align: left;
  }
  .ath-page-table td.is-long {
    min-width: 0;
  }
  .ath-page-table td::before {
    content: attr(data-label);
    font-size: 12px;
    font-weight: 600;
    color: var(--ath-muted);
  }
  .ath-page-table td:not([data-label])::before,
  .ath-page-table td[data-label=&quot;&quot;]::before {
    display: none;
  }
  .ath-page-table td:not([data-label]),
  .ath-page-table td[data-label=&quot;&quot;] {
    grid-template-columns: minmax(0, 1fr);
  }
  .ath-page-table td:first-child {
    font-size: 15px;
  }
  .ath-page-table td:last-child {
    border-bottom: 0;
  }
  .ath-page-table td.is-blank {
    display: none;
  }
}

@media print {
  .ath-page {
    padding: 0;
    background: #fff;
  }
  .ath-page-top,
  .ath-page-filters {
    display: none;
  }
  .ath-page-panel,
  .ath-page-kpi {
    box-shadow: none;
  }
  .ath-page-table-wrap {
    overflow: visible;
  }
}

/* Server-rendered report bodies (live report pages and submittal records) sit inside this shell, which owns the padding. */
.ath-page-embed .ath-report-surface .ath-report-page,
.ath-page-embed .ath-report-surface .ath-field-page {
  padding: 0 !important;
}
.ath-page-embed .ath-report-surface .ath-field-wide {
  max-width: none !important;
}
.ath-page-embed + .ath-page-panel {
  margin-top: 22px;
}
.ath-page-bar &gt; div {
  max-width: none !important;
  margin: 0 0 16px !important;
  padding: 0 !important;
}

;border:1px solid #D1D5DB;border-radius:10px;padding:12px&quot;&gt;&lt;div style=&quot;font-size:12px;color:#6B7280&quot;&gt;Deliveries&lt;/div&gt;&lt;div class=&quot;ath-report-tile-value&quot; style=&quot;font-size:20px;font-weight:600;color:#1E3A5F&quot;&gt;0&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ath-report-tile&quot; style=&quot;flex:1 1 160px;background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:12px&quot;&gt;&lt;div style=&quot;font-size:12px;color:#6B7280&quot;&gt;Risks&lt;/div&gt;&lt;div class=&quot;ath-report-tile-value&quot; style=&quot;font-size:20px;font-weight:600;color:#1E3A5F&quot;&gt;0&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ath-report-tile&quot; style=&quot;flex:1 1 160px;background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:12px&quot;&gt;&lt;div style=&quot;font-size:12px;color:#6B7280&quot;&gt;Overdue&lt;/div&gt;&lt;div class=&quot;ath-report-tile-value&quot; style=&quot;font-size:20px;font-weight:600;color:#1E3A5F&quot;&gt;0&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;section style=&quot;background:#fff;border:1px solid #D1D5DB;border-radius:12px;padding:16px;margin:0 0 16px&quot;&gt;&lt;h2 style=&quot;margin:0 0 12px;font-size:13px;letter-spacing:.06em;color:#1E3A5F&quot;&gt;TOP 3 PRIORITIES&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px&quot;&gt;&lt;div style=&quot;border:1px solid #D1D5DB;border-left:4px solid #1E5FED;border-radius:10px;padding:12px&quot;&gt;&lt;div style=&quot;font-size:18px;font-weight:700;color:#2563EB&quot;&gt;1&lt;/div&gt;&lt;div style=&quot;font-weight:600;color:#1E3A5F;margin:4px 0&quot;&gt;Synthetic reference LONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCE&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:#6B7280&quot;&gt;Owner: Synthetic reference LONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCE · Due &lt;span style=&quot;color:#6B7280;font-weight:400&quot;&gt;Nov 3, 2026&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section style=&quot;background:#fff;border:1px solid #D1D5DB;border-radius:12px;padding:16px;margin:0 0 16px&quot;&gt;&lt;h2 style=&quot;margin:0 0 12px;font-size:13px;letter-spacing:.06em;color:#1E3A5F&quot;&gt;CALENDAR&lt;/h2&gt;&lt;div class=&quot;ath-report-table-scroll&quot; role=&quot;region&quot; aria-label=&quot;Lookahead calendar&quot; tabindex=&quot;0&quot;&gt;&lt;table style=&quot;border-collapse:collapse;width:100%&quot;&gt;&lt;thead&gt;&lt;tr style=&quot;text-align:left;font-size:12px;color:#6B7280&quot;&gt;&lt;th style=&quot;padding:4px 8px&quot;&gt;Activity&lt;/th&gt;&lt;th style=&quot;padding:4px 8px&quot;&gt;Float&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;WEEK 1&lt;br&gt;Mon 11/2&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Tue 11/3&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Wed 11/4&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Thu 11/5&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Fri 11/6&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;border-left:2px solid #D1D5DB;&quot;&gt;WEEK 2&lt;br&gt;Mon 11/9&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Tue 11/10&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Wed 11/11&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Thu 11/12&lt;/th&gt;&lt;th style=&quot;padding:4px 2px;font-size:11px;color:#6B7280;text-align:center;&quot;&gt;&lt;br&gt;Fri 11/13&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr id=&quot;activity-SYN-A1&quot; style=&quot;border-top:1px solid #F3F4F6&quot;&gt;&lt;td style=&quot;padding:6px 8px;font-size:12px;font-weight:600;color:#1E3A5F&quot; data-id=&quot;SYN-A1&quot;&gt;Synthetic reference LONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCELONGREFERENCE&lt;div style=&quot;font-size:11px;font-weight:400;color:#6B7280&quot;&gt;SYN-A1&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:6px 8px;font-size:12px;color:#2563EB;text-align:center&quot;&gt;0&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;border-left:2px solid #D1D5DB;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;div style=&quot;height:12px;border-radius:3px;background:#2563EB&quot;&gt;&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:4px 2px;min-width:44px;text-align:center;&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;margin:12px 0 0;font-size:12px;color:#6B7280&quot;&gt;&lt;span style=&quot;display:inline-block;width:10px;height:10px;border-radius:2px;background:#2563EB&quot;&gt;&lt;/span&gt; Critical &amp;nbsp; &lt;span style=&quot;display:inline-block;width:10px;height:10px;border-radius:2px;background:#9CA3AF&quot;&gt;&lt;/span&gt; Non-critical &amp;nbsp; 📋 Inspection &amp;nbsp; 🚚 Delivery &amp;nbsp; ◆ Milestone &amp;nbsp; &lt;span style=&quot;color:#DC2626&quot;&gt;⚑&lt;/span&gt; Risk&lt;/p&gt;&lt;/section&gt;&lt;p style=&quot;margin:24px 0 0;font-size:12px;color:#9CA3AF&quot;&gt;Private to your company · updates when Athena saves a new version · Athena powered by ALP&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;" style="width:820px;height:960px;border:0;background:#fff"></iframe><iframe srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;lookahead.html&lt;/title&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap&quot;&gt;&lt;style&gt;body{margin:0}/*
 * Shared web-page shell for Athena&#x27;s /r/ job pages (RFI, RFC and change order logs, and the live report pages).
 * Same look as the accounting suite: soft blue-gray page, white panels, navy ink, one link blue.
 * Desktop uses the full width up to 1440px; tablet keeps tables at real width with a side scroll;
 * phones stack every table row into a labelled card.
 */
.ath-page {
  --ath-ink: #18314f;
  --ath-ink-strong: #183b63;
  --ath-muted: #65788e;
  --ath-soft: #53677d;
  --ath-line: #dfe7f0;
  --ath-line-soft: #e8edf4;
  --ath-head: #edf3fa;
  --ath-link: #2465cb;
  --ath-focus: #659ff4;
  --ath-alert: #dc2626;
  min-height: 100vh;
  min-width: 0;
  padding: 24px clamp(16px, 3vw, 40px) 56px;
  background: #f5f8fc;
  color: var(--ath-ink);
  font:
    14px/1.55 &quot;Archivo&quot;,
    Arial,
    sans-serif;
  overflow-wrap: anywhere;
}
.ath-page *,
.ath-page *::before,
.ath-page *::after {
  box-sizing: border-box;
}
.ath-page a {
  color: var(--ath-link);
  text-underline-offset: 3px;
}
.ath-page :is(a, button, input, select, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--ath-focus);
  outline-offset: 3px;
}
.ath-page-wrap {
  max-width: 1440px;
  margin: 0 auto;
  min-width: 0;
}

/* Top bar: Athena mark on the left, project links on the right. */
.ath-page-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 20px;
  margin-bottom: 22px;
}
.ath-page-mark {
  color: #6080a4;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.ath-page-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  font-size: 13px;
}
.ath-page-nav a {
  font-weight: 600;
  text-decoration: none;
}
.ath-page-nav a:hover {
  text-decoration: underline;
}
.ath-page-account {
  color: var(--ath-muted);
  font-size: 12px;
}

/* Title row: title and job on the left, filters on the right on wide screens. */
.ath-page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 24px;
  margin-bottom: 22px;
}
.ath-page-head h1 {
  margin: 0;
  font-size: clamp(24px, 3vw, 32px);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--ath-ink);
}
.ath-page-sub {
  margin: 6px 0 0;
  color: var(--ath-soft);
  font-size: 14px;
}
.ath-page-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
}
.ath-page-filters label {
  display: grid;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ath-soft);
}
.ath-page-filters label.ath-page-check {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  font-size: 13px;
}
.ath-page select {
  min-height: 42px;
  min-width: 11rem;
  max-width: 100%;
  padding: 9px 12px;
  background: #fff;
  border: 1px solid #cbd6e3;
  border-radius: 7px;
  font: inherit;
  font-size: 14px;
  color: var(--ath-ink);
  box-shadow: 0 1px 2px #18345304;
}
.ath-page input[type=&quot;checkbox&quot;] {
  width: 18px;
  height: 18px;
  accent-color: var(--ath-link);
}
.ath-page button {
  min-height: 42px;
  padding: 9px 16px;
  border: 1px solid #bbcee7;
  border-radius: 7px;
  background: #fff;
  color: var(--ath-link);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.ath-page-content &gt; * + * {
  margin-top: 22px;
}

/* Number tiles: one row on desktop, two across on phones. */
.ath-page-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin: 0;
}
.ath-page-kpi {
  padding: 16px 18px;
  background: #fff;
  border: 1px solid var(--ath-line);
  border-radius: 12px;
  box-shadow: 0 3px 12px #18345304;
}
.ath-page-kpi dt {
  font-size: 12px;
  color: var(--ath-muted);
}
.ath-page-kpi dd {
  margin: 2px 0 0;
  font-size: 24px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--ath-ink-strong);
}
.ath-page-kpi[data-alert] {
  border-color: #f3c8d0;
}
.ath-page-kpi[data-alert] dd {
  color: var(--ath-alert);
}

/* White panel per section. */
.ath-page-panel {
  min-width: 0;
  padding: 22px;
  background: #fff;
  border: 1px solid var(--ath-line);
  border-radius: 14px;
  box-shadow: 0 3px 12px #18345304;
}
.ath-page-panel &gt; h2 {
  margin: 0 0 14px;
  font-size: 18px;
  line-height: 1.35;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--ath-ink);
}
.ath-page-panel &gt; ul {
  margin: 0;
  padding-left: 20px;
}
.ath-page-panel &gt; ul &gt; li + li {
  margin-top: 6px;
}
.ath-page-panel .ath-page-literal {
  white-space: pre-wrap;
}
.ath-page-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ath-page-links a {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid #bbcee7;
  border-radius: 7px;
  background: #fff;
  font-weight: 600;
  text-decoration: none;
}
.ath-page-alert {
  padding: 14px 16px;
  background: #fff3f5;
  border: 1px solid #f3c8d0;
  border-radius: 10px;
  color: #9f243a;
}
.ath-page-alert strong {
  display: block;
  margin-bottom: 2px;
}
.ath-page-empty {
  padding: 14px 16px;
  border: 1px dashed #d7e2ef;
  border-radius: 9px;
  background: #f8fafd;
  color: var(--ath-muted);
}
.ath-page-next {
  margin: 0;
  color: var(--ath-soft);
}
.ath-page-next strong {
  color: var(--ath-ink);
}
.ath-page-foot {
  margin: 28px 0 0;
  font-size: 12px;
  color: var(--ath-muted);
}
.ath-page-status {
  padding: 32px 0;
  color: var(--ath-soft);
}

/* Tables: full width on desktop, real width with a side scroll on tablet, stacked cards on phone. */
.ath-page-table-wrap {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--ath-line);
  border-radius: 10px;
  background: #fff;
}
.ath-page-table {
  width: 100%;
  border-collapse: collapse;
  /* Words break only when they must, so narrow columns never shrink to one letter a line. */
  overflow-wrap: break-word;
  font-size: 13px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.ath-page-table th,
.ath-page-table td {
  padding: 12px 14px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--ath-line-soft);
}
.ath-page-table thead {
  background: var(--ath-head);
  color: var(--ath-soft);
}
.ath-page-table thead th {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.015em;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ath-page-table tbody tr:last-child td {
  border-bottom: 0;
}
.ath-page-table tbody tr:nth-child(even) {
  background: #fafcfe;
}
.ath-page-table tbody tr:hover {
  background: #f0f6ff;
}
.ath-page-table td:first-child {
  white-space: nowrap;
}
.ath-page-table td:first-child a {
  font-weight: 650;
  text-decoration: none;
}
.ath-page-table td:first-child a:hover {
  text-decoration: underline;
}
.ath-page-table :is(td, th).is-short,
.ath-page-table :is(td, th).is-num {
  white-space: nowrap;
  overflow-wrap: normal;
}
.ath-page-table td.is-num {
  text-align: right;
}
.ath-page-table td.is-long {
  min-width: 16rem;
}
.ath-page-table td.is-blank::after {
  content: &quot;–&quot;;
  color: #a3b2c3;
}
.ath-page-table tr[data-alert] td:first-child {
  box-shadow: inset 4px 0 0 var(--ath-alert);
}
.ath-page-table tr[data-alert] td:first-child a,
.ath-page-flag {
  color: var(--ath-alert);
}
.ath-page-flag {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ath-page-ref {
  display: block;
  font-size: 12px;
  color: var(--ath-muted);
}

/* Tablet: tables keep a readable width and pan sideways inside their frame. */
@media (max-width: 1024px) {
  .ath-page-table {
    min-width: 860px;
  }
  .ath-page-head {
    align-items: flex-start;
  }
}

/* Phone: each row becomes a card with the column name beside each value. */
@media (max-width: 720px) {
  .ath-page {
    padding: 18px 14px 40px;
  }
  .ath-page-top {
    margin-bottom: 16px;
  }
  .ath-page-head {
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 16px;
  }
  .ath-page-filters {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .ath-page select {
    width: 100%;
  }
  .ath-page-kpis {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
  }
  .ath-page-kpi {
    padding: 12px 14px;
  }
  .ath-page-kpi dd {
    font-size: 20px;
  }
  .ath-page-panel {
    padding: 16px;
  }
  .ath-page-table-wrap {
    overflow: visible;
    border: 0;
    background: transparent;
  }
  .ath-page-table {
    min-width: 0;
  }
  .ath-page-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .ath-page-table,
  .ath-page-table tbody,
