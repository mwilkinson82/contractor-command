  <text x="90" y="456" fill="#6B655D" font-family="Helvetica Neue, Arial, sans-serif" font-size="24">The operating system, working room, and field tools</text>
  <text x="90" y="489" fill="#6B655D" font-family="Helvetica Neue, Arial, sans-serif" font-size="24">for contractors building a real company.</text>

