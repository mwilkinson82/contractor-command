    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#171310" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#EDE7DC"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="52" y="52" width="1096" height="526" rx="34" fill="#FAF7F0" stroke="#D8D0C4"/>

  <g transform="translate(88 88)">
